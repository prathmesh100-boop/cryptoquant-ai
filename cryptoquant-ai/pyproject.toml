[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoquant-ai"
version = "0.1.0"
description = "Modular cryptocurrency algorithmic trading research platform (paper-first)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pandas>=2.1,<3",
    # numpy 2.5 + pandas 2.3 emits a Timedelta DeprecationWarning; constrain to tested range
    "numpy>=2.2,<2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
